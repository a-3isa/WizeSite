workflows:
  android_release_artifact:
    name: Android Release Artifact
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - buildozer_upload_keystore # Replace with your Android keystore reference in Codemagic.
      vars:
        PACKAGE_NAME: com.ahmed.buildozer
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed Android app bundle
        script: |
          flutter build appbundle --release \
            --build-name="${BUILD_NAME_PREFIX}.${BUILD_NUMBER}" \
            --build-number="${BUILD_NUMBER}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

  android_google_play_internal:
    name: Android Google Play Internal
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play # Must contain GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS.
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - buildozer_upload_keystore # Replace with your Android keystore reference in Codemagic.
      vars:
        PACKAGE_NAME: com.ahmed.buildozer
        GOOGLE_PLAY_TRACK: internal
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed Android app bundle
        script: |
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK" || true)
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            PROJECT_BUILD_NUMBER="$BUILD_NUMBER"
          else
            PROJECT_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi

          flutter build appbundle --release \
            --build-name="${BUILD_NAME_PREFIX}.${PROJECT_BUILD_NUMBER}" \
            --build-number="${PROJECT_BUILD_NUMBER}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios_release_artifact:
    name: iOS Release Artifact
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Buildozer

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        BUNDLE_ID: com.ahmed.buildozer
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed iOS archive
        script: |
          flutter build ipa --release \
            --build-name="${BUILD_NAME_PREFIX}.0" \
            --build-number="${BUILD_NUMBER}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios_testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Buildozer

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        BUNDLE_ID: com.ahmed.buildozer
        APP_STORE_APPLE_ID: 1234567890 # Replace with the numeric Apple app ID from App Store Connect.
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed iOS archive
        script: |
          LATEST_APP_STORE_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST_APP_STORE_BUILD_NUMBER" ]; then
            PROJECT_BUILD_NUMBER="$BUILD_NUMBER"
          else
            PROJECT_BUILD_NUMBER=$((LATEST_APP_STORE_BUILD_NUMBER + 1))
          fi

          flutter build ipa --release \
            --build-name="${BUILD_NAME_PREFIX}.${PROJECT_BUILD_NUMBER}" \
            --build-number="${PROJECT_BUILD_NUMBER}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
