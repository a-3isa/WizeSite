# Codemagic CI/CD for Buildozer
# Based on the working Hesn Codemagic structure.
#
# Before first run:
# 1. In Codemagic Team -> Integrations, make sure the App Store Connect API key
#    named "Buildozer Tracker" exists and has access to this app.
# 2. In Codemagic app -> Code signing, add the iOS distribution certificate and
#    provisioning profile for com.ahmed.buildozer.
# 3. Set APP_ID below to the numeric App Store Connect app ID for Buildozer.

workflows:
  android_release_artifact:
    name: Android Release Artifact
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - buildozer_upload_keystore
      vars:
        PACKAGE_NAME: com.ahmed.buildozer
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed Android app bundle
        script: |
          flutter build appbundle --release \
            --build-name="${BUILD_NAME_PREFIX}.${BUILD_NUMBER}" \
            --build-number="${BUILD_NUMBER}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

  android_google_play_internal:
    name: Android Google Play Internal
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - buildozer_upload_keystore
      vars:
        PACKAGE_NAME: com.ahmed.buildozer
        GOOGLE_PLAY_TRACK: internal
        BUILD_NAME_PREFIX: 1.0

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build signed Android app bundle
        script: |
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK" || true)
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            PROJECT_BUILD_NUMBER="$BUILD_NUMBER"
          else
            PROJECT_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi

          flutter build appbundle --release \
            --build-name="${BUILD_NAME_PREFIX}.${PROJECT_BUILD_NUMBER}" \
            --build-number="${PROJECT_BUILD_NUMBER}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios_release_artifact:
    name: iOS Release Artifact
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        APP_ID: "6760477814"
        FIREBASE_IOS_APP_ID: "1:549941684400:ios:33da1c501d6650638e7375"
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: Buildozer Tracker

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Set up code signing
        script: |
          echo "Setting up code signing for iOS release artifact..."
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Flutter analyze
        script: flutter analyze

      - name: Resolve next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          NEXT_BUILD=$((LATEST + 1))
          [ "$NEXT_BUILD" -lt 1 ] && NEXT_BUILD=1
          echo "NEXT_BUILD=$NEXT_BUILD" >> $CM_ENV
          echo ">>> Using build number: $NEXT_BUILD (latest was $LATEST)"

      - name: Build signed iOS archive
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          echo "Uploading dSYMs to Firebase Crashlytics..."
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -d "$DSYM_DIR" ]; then
            find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
              echo "Uploading: $dsym"
              ios/Pods/FirebaseCrashlytics/upload-symbols \
                -gsp ios/Runner/GoogleService-Info.plist \
                -p ios "$dsym"
            done
          else
            echo "dSYM directory not found at $DSYM_DIR — skipping upload"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios_testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        APP_ID: "6760477814"
        FIREBASE_IOS_APP_ID: "1:549941684400:ios:33da1c501d6650638e7375"
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: Buildozer Tracker

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Set up code signing
        script: |
          echo "Setting up code signing for TestFlight build..."
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Flutter analyze
        script: flutter analyze

      - name: Resolve next TestFlight build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          NEXT_BUILD=$((LATEST + 1))
          [ "$NEXT_BUILD" -lt 1 ] && NEXT_BUILD=1
          echo "NEXT_BUILD=$NEXT_BUILD" >> $CM_ENV
          echo ">>> Using build number: $NEXT_BUILD (latest was $LATEST)"

      - name: Build signed iOS archive
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          echo "Uploading dSYMs to Firebase Crashlytics..."
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -d "$DSYM_DIR" ]; then
            find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
              echo "Uploading: $dsym"
              ios/Pods/FirebaseCrashlytics/upload-symbols \
                -gsp ios/Runner/GoogleService-Info.plist \
                -p ios "$dsym"
            done
          else
            echo "dSYM directory not found at $DSYM_DIR — skipping upload"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
