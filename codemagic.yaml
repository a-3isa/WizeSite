# Codemagic CI/CD for Buildozer
# Based on the working Hesn Codemagic structure.
#
# Before first run:
# 1. In Codemagic Team -> Integrations, make sure the App Store Connect API key
#    named "Buildozer Tracker" exists and has access to this app.
# 2. In Codemagic app -> Code signing, add the iOS distribution certificate and
#    provisioning profile for com.ahmed.buildozer.
# 3. Set APP_ID below to the numeric App Store Connect app ID for Buildozer.

workflows:
  ios_release_artifact:
    name: iOS Release Artifact
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        APP_ID: "6760477814"
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6760477814"
        FIREBASE_IOS_APP_ID: "1:549941684400:ios:33da1c501d6650638e7375"
      flutter: stable
      xcode: 26.4
      cocoapods: default
      node: 22

    integrations:
      app_store_connect: Buildozer

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Set up code signing
        script: |
          echo "Setting up code signing for iOS release artifact..."
          xcode-project use-profiles

      - name: Verify Xcode SDK
        script: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Flutter analyze
        script: flutter analyze

      - name: Flutter tests
        script: flutter test

      - name: Cloud Functions tests
        script: |
          cd functions
          npm ci
          npm run lint
          npx --yes firebase-tools emulators:exec --only firestore,storage "npm test"

      - name: Verify App Store Connect app access
        script: |
          app-store-connect apps get "$APP_ID" >/dev/null
          echo ">>> App Store Connect app $APP_ID is visible to this integration"

      - name: Resolve next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          NEXT_BUILD=$((LATEST + 1))
          [ "$NEXT_BUILD" -lt 1 ] && NEXT_BUILD=1
          echo "NEXT_BUILD=$NEXT_BUILD" >> $CM_ENV
          echo ">>> Using build number: $NEXT_BUILD (latest was $LATEST)"

      - name: Build signed iOS archive
        script: |
          PUBSPEC_VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1))")
          flutter build ipa --release \
            --build-name=$PUBSPEC_VERSION \
            --build-number=$NEXT_BUILD \
            --dart-define=API_BASE_URL=${API_BASE_URL:-https://api.buildozer.dpdns.org} \
            --dart-define=SYNC_URL=${SYNC_URL:-https://sync.buildozer.dpdns.org} \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          echo "Uploading dSYMs to Firebase Crashlytics..."
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -d "$DSYM_DIR" ]; then
            find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
              echo "Uploading: $dsym"
              ios/Pods/FirebaseCrashlytics/upload-symbols \
                -gsp ios/Runner/GoogleService-Info.plist \
                -p ios "$dsym"
            done
          else
            echo "dSYM directory not found at $DSYM_DIR — skipping upload"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios_testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.buildozer
      vars:
        APP_ID: "6760477814"
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6760477814"
        FIREBASE_IOS_APP_ID: "1:549941684400:ios:33da1c501d6650638e7375"
      flutter: stable
      xcode: 26.4
      cocoapods: default
      node: 22

    integrations:
      app_store_connect: Buildozer

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Verify Xcode SDK
        script: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"
          
      - name: Set up code signing
        script: |
          echo "Setting up code signing for TestFlight build..."
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Flutter analyze
        script: flutter analyze

      - name: Flutter tests
        script: flutter test

      - name: Cloud Functions tests
        script: |
          cd functions
          npm ci
          npm run lint
          npx --yes firebase-tools emulators:exec --only firestore,storage "npm test"

      - name: Verify App Store Connect app access
        script: |
          app-store-connect apps get "$APP_ID" >/dev/null
          echo ">>> App Store Connect app $APP_ID is visible to this integration"

      - name: Resolve next TestFlight build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          NEXT_BUILD=$((LATEST + 1))
          [ "$NEXT_BUILD" -lt 1 ] && NEXT_BUILD=1
          echo "NEXT_BUILD=$NEXT_BUILD" >> $CM_ENV
          echo ">>> Using build number: $NEXT_BUILD (latest was $LATEST)"

      - name: Build signed iOS archive
        script: |
          PUBSPEC_VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1))")
          flutter build ipa --release \
            --build-name=$PUBSPEC_VERSION \
            --build-number=$NEXT_BUILD \
            --dart-define=API_BASE_URL=${API_BASE_URL:-https://api.buildozer.dpdns.org} \
            --dart-define=SYNC_URL=${SYNC_URL:-https://sync.buildozer.dpdns.org} \
            --dart-define=SHOW_CRASHLYTICS_TEST=true \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          echo "Uploading dSYMs to Firebase Crashlytics..."
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -d "$DSYM_DIR" ]; then
            find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
              echo "Uploading: $dsym"
              ios/Pods/FirebaseCrashlytics/upload-symbols \
                -gsp ios/Runner/GoogleService-Info.plist \
                -p ios "$dsym"
            done
          else
            echo "dSYM directory not found at $DSYM_DIR — skipping upload"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android_release_artifact:
    name: Android Release Artifact
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      java: 17
      flutter: stable
      node: 22
      android_signing:
        - buildozer
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Cloud Functions tests
        script: |
          cd functions
          npm ci
          npm run lint
          npx --yes firebase-tools emulators:exec --only firestore,storage "npm test"
      - name: Build signed Android App Bundle
        script: |
          PUBSPEC_VERSION=$(python3 -c "import re; print(re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1))")
          flutter build appbundle --release \
            --build-name=$PUBSPEC_VERSION \
            --build-number=${BUILD_NUMBER:-1} \
            --dart-define=API_BASE_URL=${API_BASE_URL:-https://api.buildozer.dpdns.org} \
            --dart-define=SYNC_URL=${SYNC_URL:-https://sync.buildozer.dpdns.org}
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  # Self-hosted backend (spec 004). Requires a Codemagic environment group "ghcr"
  # with GHCR_USER and GHCR_TOKEN (a GitHub token with write:packages).
  server:
    name: Server (API) CI
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      groups:
        - ghcr
    triggering:
      events:
        - push
        - pull_request
    when:
      changeset:
        includes:
          - "server/"
          - "ops/"
    scripts:
      - name: Secret scan
        script: |
          docker run --rm -v "$CM_BUILD_DIR:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: Install, lint, unit tests
        script: |
          cd server
          npm ci
          npm run lint
          npm test
      - name: Integration tests (Postgres + PowerSync)
        script: |
          cd server
          docker compose -f compose.test.yml up -d --wait
          npm run migrate -- --database-url-var TEST_DATABASE_URL
          npm run test:integration
          docker compose -f compose.test.yml down -v
        environment:
          vars:
            TEST_DATABASE_URL: postgres://wizesite:wizesite-test@localhost:55432/wizesite_test
            SYNC_TEST_URL: http://localhost:58081
      - name: Build and push image
        script: |
          cd server
          IMAGE="ghcr.io/$GHCR_USER/wizesite-server:$CM_COMMIT"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
