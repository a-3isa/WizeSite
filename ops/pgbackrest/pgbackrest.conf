# pgBackRest settings (tasks.md T091). Mounted read-only into the postgres container at
# /etc/pgbackrest/pgbackrest.conf. Nothing secret here: the bucket, endpoint, keys and the
# repository encryption passphrase come from PGBACKREST_* variables in /srv/wizesite/.env
# (see ops/BACKUPS.md).

[global]
# S3-compatible object storage (Backblaze B2 or Cloudflare R2).
repo1-type=s3
repo1-path=/wizesite/pgbackrest
repo1-s3-uri-style=path
# Everything in the repository is encrypted before it leaves the VPS.
repo1-cipher-type=aes-256-cbc
# Keep 30 days of full backups and the WAL needed to restore to any point in them.
repo1-retention-full-type=time
repo1-retention-full=30

compress-type=zst
process-max=1
start-fast=y
archive-async=n

# Writable state inside the container (/srv/wizesite/pgbackrest on the host).
log-path=/var/lib/pgbackrest/log
lock-path=/var/lib/pgbackrest/lock
spool-path=/var/lib/pgbackrest/spool
log-level-console=info
log-level-file=info

[wizesite]
pg1-path=/var/lib/postgresql/data
pg1-user=wizesite
pg1-database=wizesite
